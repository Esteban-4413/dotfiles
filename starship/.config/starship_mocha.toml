palette = "catppuccin_mocha"

format = """
${custom.home_user}\
$directory\
$git_branch\
$git_status\
$character
"""
right_format = """
$c\
$cpp\
$java\
$lua\
$python\
$rust\
$haskell\
$cmd_duration\
$battery
"""

[line_break]
disabled = true

[custom.home_user]
command = "echo estebanano"
when = 'test "$PWD" = "$HOME"'
format = "[$output]($style) "
style = "cyan"


[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[username]
disabled = true
style_user = 'cyan'
style_root = 'cyan bold'
format = '[$user ]($style)'
show_always = false
aliases = { "estebanyepezorozco" = "estebanquito" }

[package]
disabled = false
symbol = "  " 
style = "dimmed blue"
format = "[$symbol$version]($style) "

# BATTERY 
[battery]
discharging_symbol = '󰂎 '
charging_symbol = '󰂄 '
empty_symbol = '󰂃 '
full_symbol = '󰁹 '

[[battery.display]]
threshold = 20
style = 'bold red'

[[battery.display]]
threshold = 35
style = 'bold yellow'

[directory]
truncation_length = 3 # how many dir are visible in the command line
truncation_symbol = ".../"

[character]
success_symbol = "[ 𝛌 ](bold mauve)"
error_symbol = "[ 𝛌 ](bold red)"

[cmd_duration]
min_time = 5000
format = "[$duration ]($style)"
style = "bold yellow"

# GIT 
[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch ]($style)"

[git_status]
conflicted = " "
ahead = "⇡ ${count}"
behind = "⇣ ${count}"
diverged ='⇕⇡${ahead_count} ⇣${behind_count}'
up_to_date = "✓"
untracked = "…"
modified = "!"
stashed = '[++\($count\)](green)'
style = "bold green"

[git_commit]
tag_symbol = '  '

[git_metrics]
added_style = 'bold green'
format = '[+added ]($added_style)/[-%deleted ]($deleted_style)'

# LANGUAGES 
[c]
symbol = " "
format = "[$symbol]($style)"

[cpp]
symbol = " "
format = "[$symbol]($style)"

[java]
symbol = " "
format = "[$symbol]($style)"

[lua]
symbol = " "
format = "[$symbol]($style)"

[python]
symbol = " "
format = "[$symbol($version)]($style)"

[rust]
symbol = "󱘗 "
format = "[$symbol]($style)"

[hostname]
ssh_symbol = " "

[haskell]
symbol = " "
format = "[$symbol]($style)"
