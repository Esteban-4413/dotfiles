palette = "catppuccin_latte"

format = """
${custom.home_user}\
$directory\
$git_branch\
$git_status\
$character
"""
right_format = """
$c\
$cpp\
$java\
$lua\
$python\
$rust\
$haskell\
$cmd_duration\
$battery
"""

[line_break]
disabled = true

[custom.home_user]
command = "echo estebanano2"
when = 'test "$PWD" = "$HOME"'
format = "[$output]($style) "
style = "cyan"


[palettes.catppuccin_latte]
rosewater = "#dc8a78"
flamingo = "#dd7878"
pink = "#ea76cb"
mauve = "#8839ef"
red = "#d20f39"
maroon = "#e64553"
peach = "#fe640b"
yellow = "#df8e1d"
green = "#40a02b"
teal = "#179299"
sky = "#04a5e5"
sapphire = "#209fb5"
blue = "#1e66f5"
lavender = "#7287fd"
text = "#4c4f69"
subtext1 = "#5c5f77"
subtext0 = "#6c6f85"
overlay2 = "#7c7f93"
overlay1 = "#8c8fa1"
overlay0 = "#9ca0b0"
surface2 = "#acb0be"
surface1 = "#bcc0cc"
surface0 = "#ccd0da"
base = "#eff1f5"
mantle = "#e6e9ef"
crust = "#dce0e8"


[username]
disabled = true
style_user = 'cyan'
style_root = 'cyan bold'
format = '[$user ]($style)'
show_always = false
aliases = { "estebanyepezorozco" = "estebanquito2" }

[package]
disabled = false
symbol = "  " 
style = "dimmed blue"
format = "[$symbol$version]($style) "

# BATTERY 
[battery]
discharging_symbol = '󰂎 '
charging_symbol = '󰂄 '
empty_symbol = '󰂃 '
full_symbol = '󰁹 '

[[battery.display]]
threshold = 20
style = 'bold red'

[[battery.display]]
threshold = 35
style = 'bold yellow'

[directory]
truncation_length = 3 # how many dir are visible in the command line
truncation_symbol = ".../"

[character]
success_symbol = "[ 𝛌 ](bold mauve)"
error_symbol = "[ 𝛌 ](bold red)"

[cmd_duration]
min_time = 5000
format = "[$duration ]($style)"
style = "bold yellow"

# GIT 
[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch ]($style)"

[git_status]
conflicted = " "
ahead = "⇡ ${count} "
behind = "⇣ ${count} "
diverged ='⇕ ⇡ ${ahead_count} ⇣ ${behind_count}'
up_to_date = "✓ "
untracked = "… "
modified = "! "
stashed = '[++\($count\)](green)'
style = "bold green"

[git_commit]
tag_symbol = '  '

[git_metrics]
added_style = 'bold green'
format = '[+added ]($added_style)/[-%deleted ]($deleted_style)'

# LANGUAGES 
[c]
symbol = " "
format = "[$symbol]($style)"

[cpp]
symbol = " "
format = "[$symbol]($style)"

[java]
symbol = " "
format = "[$symbol]($style)"

[lua]
symbol = " "
format = "[$symbol]($style)"

[python]
symbol = " "
format = "[$symbol($version)]($style)"

[rust]
symbol = "󱘗 "
format = "[$symbol]($style)"

[hostname]
ssh_symbol = " "

[haskell]
symbol = " "
format = "[$symbol]($style)"
