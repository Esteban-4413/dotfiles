palette = "catppuccin_frappe"

format = """
${custom.home_user}\
$directory\
$git_branch\
$git_status\
$character
"""
right_format = """
$c\
$cpp\
$java\
$lua\
$python\
$rust\
$haskell\
$cmd_duration\
$battery
"""

[line_break]
disabled = true

[custom.home_user]
command = "echo estebanano2"
when = 'test "$PWD" = "$HOME"'
format = "[$output]($style) "
style = "cyan"
[palettes.catppuccin_frappe]
rosewater = "#f2d5cf"
flamingo = "#eebebe"
pink = "#f4b8e4"
mauve = "#ca9ee6"
red = "#e78284"
maroon = "#ea999c"
peach = "#ef9f76"
yellow = "#e5c890"
green = "#a6d189"
teal = "#81c8be"
sky = "#99d1db"
sapphire = "#85c1dc"
blue = "#8caaee"
lavender = "#babbf1"
text = "#c6d0f5"
subtext1 = "#b5bfe2"
subtext0 = "#a5adce"
overlay2 = "#949cbb"
overlay1 = "#838ba7"
overlay0 = "#737994"
surface2 = "#626880"
surface1 = "#51576d"
surface0 = "#414559"
base = "#303446"
mantle = "#292c3c"
crust = "#232634"


[username]
disabled = true
style_user = 'cyan'
style_root = 'cyan bold'
format = '[$user ]($style)'
show_always = false
aliases = { "estebanyepezorozco" = "estebanquito2" }

[package]
disabled = false
symbol = "  " 
style = "dimmed blue"
format = "[$symbol$version]($style) "

# BATTERY 
[battery]
discharging_symbol = '󰂎 '
charging_symbol = '󰂄 '
empty_symbol = '󰂃 '
full_symbol = '󰁹 '

[[battery.display]]
threshold = 20
style = 'bold red'

[[battery.display]]
threshold = 35
style = 'bold yellow'

[directory]
truncation_length = 3 # how many dir are visible in the command line
truncation_symbol = ".../"

[character]
success_symbol = "[ 𝛌 ](bold mauve)"
error_symbol = "[ 𝛌 ](bold red)"

[cmd_duration]
min_time = 5000
format = "[$duration ]($style)"
style = "bold yellow"

# GIT 
[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch ]($style)"

[git_status]
conflicted = " "
ahead = "⇡ ${count} "
behind = "⇣ ${count} "
diverged ='⇕ ⇡ ${ahead_count} ⇣ ${behind_count}'
up_to_date = "✓ "
untracked = "… "
modified = "! "
stashed = '[++\($count\)](green)'
style = "bold green"

[git_commit]
tag_symbol = '  '

[git_metrics]
added_style = 'bold green'
format = '[+added ]($added_style)/[-%deleted ]($deleted_style)'

# LANGUAGES 
[c]
symbol = " "
format = "[$symbol]($style)"

[cpp]
symbol = " "
format = "[$symbol]($style)"

[java]
symbol = " "
format = "[$symbol]($style)"

[lua]
symbol = " "
format = "[$symbol]($style)"

[python]
symbol = " "
format = "[$symbol($version)]($style)"

[rust]
symbol = "󱘗 "
format = "[$symbol]($style)"

[hostname]
ssh_symbol = " "

[haskell]
symbol = " "
format = "[$symbol]($style)"
