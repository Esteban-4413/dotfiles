font_family      JetBrainsMono Nerd Font
font_size 12.0

window_padding_width 10
# window_padding_
remember_window_size no
initial_window_width 120c
initial_window_height 40c
active_border_color #00ff00
window_border_width 0.5pt
# draw_minimal_borders yes

background_opacity 0.8
background_blur 20

cursor_shape block
cursor_blink_interval -1
cursor_stop_blinking_after 15.0
shell_integration no-cursor

# --- Tema ---
# Kitty no cambia automáticamente entre claro/oscuro con una sola línea por defecto.
# Para aplicar Catppuccin Mocha, ejecuta este comando en la terminal:
# kitten themes Catppuccin-Mocha
#

# tab_bar_edge top

# Estilo visual moderno (tipo powerline)
tab_bar_style slant
tab_bar_margin_width 0.5

# Ocultar la barra de título nativa de macOS y dejar solo las pestañas
hide_window_decorations titlebar-only

# macos specific tweaks
macos_quit_when_last_window_closed no
# macos_thicken_font 0.25 

